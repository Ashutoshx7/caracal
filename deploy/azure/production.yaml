#
# Azure Container Apps production deployment configuration.

# Reviewed in pull requests like any other code. Settings that change behaviour
# live here in the open; addresses and identities are substituted at deploy time
# from environment variables so this file carries no account detail.
#
# Long-lived infrastructure is assumed to exist: resource group, Container Apps
# environment, PostgreSQL, Redis, Key Vault, and the registry. This file only
# describes the application deployment.

target: azureContainerApps

release:
  registry: ${AZURE_REGISTRY_SERVER}
  # Replaced by the workflow with the version being deployed.
  version: 0.0.0

# Published-mode guardrails. Never lower this for a customer-serving deployment.
mode: stable
logLevel: info

database:
  host: ${AZURE_POSTGRES_HOST}
  port: 5432
  user: caracal
  name: caracal
  sslMode: require

# Redis is reached through the redisUrl secret in Key Vault. Azure Cache for
# Redis serves TLS on 6380 and disables the plaintext port, so that secret must
# use the rediss:// scheme.

public:
  web: https://${CARACAL_CONSOLE_HOST}
  api: https://${CARACAL_API_HOST}
  sts: https://${CARACAL_STS_HOST}
  gateway: https://${CARACAL_GATEWAY_HOST}

observability:
  otlpEndpoint: ''

coordinator:
  idempotencyRetentionSeconds: 604800
  generatedIdempotencyRetentionSeconds: 86400
  maxReceiptsPerScope: 10000
  bodyLimitBytes: 262144
  sessionRetentionDays: 90

azure:
  resourceGroup: ${AZURE_RESOURCE_GROUP}
  location: ${AZURE_LOCATION}
  environmentName: ${AZURE_ENVIRONMENT_NAME}
  environmentDomain: ${AZURE_ENVIRONMENT_DOMAIN}
  identityId: ${AZURE_IDENTITY_ID}
  keyVaultUrl: ${AZURE_KEY_VAULT_URL}
  # Durable audit spill needs an NFS share. Left unset, a replaced replica loses
  # evidence it had not yet drained to Redis.
  # stateStorageName: caracal-replay
