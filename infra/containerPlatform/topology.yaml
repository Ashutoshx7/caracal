#
# Platform-neutral service topology for managed container platforms.

# Every value here is a property of the Caracal release itself, not of any cloud.
# Targets under ./targets translate this file into a provider manifest; anything
# a provider needs beyond this file belongs in the deployment config, not here.
#
# secretEnv maps a logical environment variable to the credential that supplies
# it. Every service accepts either the variable itself or its _FILE form, so a
# target chooses the delivery its platform supports: a projected file where the
# platform can mount secrets, the variable directly where it cannot. The
# topology never states which.
#
# Placeholders resolved at render time:
#   {state}          writable state directory
#   {mode}           release mode
#   {logLevel}       log level
#   {otlp}           OTLP exporter endpoint
#   {internal:NAME}  in-environment base URL of another service
#   {public:NAME}    externally reachable base URL of a service
#   {issuer}         public STS issuer URL, falling back to {internal:sts}
#   {database.KEY}   database connection field
#   {coordinator.KEY} coordinator tuning field

version: 1

secretMountPath: /run/secrets
statePath: /var/lib/caracal

# The published images are role-agnostic: one Go image carries the sts, gateway,
# and audit binaries, one Node image carries api and coordinator. The start
# command selects the role, so every service below runs a stock released image
# with no rebuild.
images:
  go: caracal-go
  node: caracal-node
  web: caracal-web
  postgres: caracal-postgres

probes:
  startup: /health
  liveness: /health
  readiness: /ready

services:
  sts:
    image: go
    command: /usr/local/bin/sts
    port: 8080
    # Resource verifiers and SDKs outside the deployment validate mandates
    # against the issuer, so STS needs a stable public origin.
    exposure: public
    scale: { min: 2, max: 8, concurrentRequests: 80 }
    resources: { cpu: 2, memory: 4Gi }
    secretEnv:
      DATABASE_URL: stsDatabaseUrl
      SECRET_STORE_KEK: secretStoreKek
      STREAMS_HMAC_KEY: streamsHmacKey
      GATEWAY_STS_HMAC_KEY: gatewayStsHmacKey
    state: true

  gateway:
    image: go
    command: /usr/local/bin/gateway
    port: 8081
    exposure: public
    # Gateway carries proxied request volume and exchanges with STS on every
    # request, so it scales further than the other services.
    scale: { min: 2, max: 16, concurrentRequests: 100 }
    resources: { cpu: 2, memory: 4Gi }
    secretEnv:
      DATABASE_URL: gatewayDatabaseUrl
      STREAMS_HMAC_KEY: streamsHmacKey
      GATEWAY_STS_HMAC_KEY: gatewayStsHmacKey
      CARACAL_ADMIN_TOKEN: caracalAdminToken
    state: true

  api:
    image: node
    command: /app/api/dist/main.js
    port: 3000
    exposure: public
    scale: { min: 2, max: 8, concurrentRequests: 80 }
    resources: { cpu: 1, memory: 2Gi }
    secretEnv:
      DATABASE_URL: apiDatabaseUrl
      SECRET_STORE_KEK: secretStoreKek
      STREAMS_HMAC_KEY: streamsHmacKey
      GATEWAY_STS_HMAC_KEY: gatewayStsHmacKey
      CARACAL_ADMIN_TOKEN: caracalAdminToken
    env:
      CARACAL_GATEWAY_URL: '{internal:gateway}'
      CARACAL_COORDINATOR_URL: '{internal:coordinator}'

  audit:
    image: go
    command: /usr/local/bin/audit
    port: 9090
    exposure: internal
    scale: { min: 2, max: 8, concurrentRequests: 80 }
    resources: { cpu: 1, memory: 2Gi }
    secretEnv:
      DATABASE_URL: auditDatabaseUrl
    env:
      AUDIT_EXPORT_TMP_DIR: '{state}/audit-export'
    state: true

  coordinator:
    image: node
    command: /app/coordinator/dist/main.js
    port: 4000
    exposure: internal
    scale: { min: 2, max: 8, concurrentRequests: 80 }
    resources: { cpu: 1, memory: 2Gi }
    secretEnv:
      DATABASE_URL: coordinatorDatabaseUrl
      STREAMS_HMAC_KEY: streamsHmacKey
      IDEMPOTENCY_HMAC_KEY: idempotencyHmacKey
      CARACAL_COORDINATOR_TOKEN: caracalCoordinatorToken
    env:
      IDEMPOTENCY_RETENTION_SECONDS: '{coordinator.idempotencyRetentionSeconds}'
      GENERATED_IDEMPOTENCY_RETENTION_SECONDS: '{coordinator.generatedIdempotencyRetentionSeconds}'
      IDEMPOTENCY_MAX_RECEIPTS_PER_SCOPE: '{coordinator.maxReceiptsPerScope}'
      COORDINATOR_BODY_LIMIT_BYTES: '{coordinator.bodyLimitBytes}'
      SESSION_RETENTION_DAYS: '{coordinator.sessionRetentionDays}'
      AGENT_COORDINATOR_SCOPE: agent:lifecycle

  # Browser-facing tier: the console SPA served same-origin by its
  # session-guarded backend-for-frontend.
  web:
    image: web
    command: /app/auth/dist/server.js
    port: 3002
    exposure: public
    scale: { min: 2, max: 4, concurrentRequests: 100 }
    resources: { cpu: 1, memory: 2Gi }
    secretEnv:
      CARACAL_AUTH_DATABASE_URL: authDatabaseUrl
      CARACAL_AUTH_SECRET: caracalAuthSecret
      CARACAL_ADMIN_TOKEN: caracalAdminToken
      CARACAL_COORDINATOR_TOKEN: caracalCoordinatorToken
    env:
      NODE_ENV: production
      CARACAL_AUTH_URL: '{public:web}'
      CARACAL_WEB_ORIGIN: '{public:web}'
      CARACAL_AUTH_SECURE_COOKIES: 'true'
      CARACAL_API_URL: '{internal:api}'
      CARACAL_COORDINATOR_URL: '{internal:coordinator}'
      CARACAL_AUTH_DATABASE_SSL: '{database.sslMode}'
      # The control-plane migration job owns auth schema provisioning, so replicas
      # never race to create it.
      CARACAL_AUTH_AUTO_MIGRATE: 'false'
    common: false

# Environment shared by every service that speaks the control-plane protocol.
commonEnv:
  CARACAL_MODE: '{mode}'
  HOST: 0.0.0.0
  LOG_LEVEL: '{logLevel}'
  STS_URL: '{internal:sts}'
  ISSUER_URL: '{issuer}'
  OTEL_EXPORTER_OTLP_ENDPOINT: '{otlp}'
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

commonSecretEnv:
  REDIS_URL: redisUrl
  AUDIT_HMAC_KEY: auditHmacKey
  METRICS_BEARER: metricsBearer

# Ordered one-shot jobs. Both must complete before a rollout so the schema a
# release expects exists before any replica of that release serves traffic.
jobs:
  - name: migrate
    image: postgres
    command: /bin/sh
    args: ['/usr/local/bin/caracal-migrate']
    resources: { cpu: 0.5, memory: 1Gi }
    secretEnv:
      PGPASSWORD: postgresPassword
      CARACAL_API_DB_PASSWORD: apiDbPassword
      CARACAL_STS_DB_PASSWORD: stsDbPassword
      CARACAL_GATEWAY_DB_PASSWORD: gatewayDbPassword
      CARACAL_AUDIT_DB_PASSWORD: auditDbPassword
      CARACAL_COORDINATOR_DB_PASSWORD: coordinatorDbPassword
      CARACAL_AUTH_DB_PASSWORD: authDbPassword
    env:
      PGHOST: '{database.host}'
      PGPORT: '{database.port}'
      PGUSER: '{database.user}'
      PGDATABASE: '{database.name}'
      PGSSLMODE: '{database.sslMode}'

  - name: authMigrate
    image: web
    command: /app/auth/dist/migrate.js
    resources: { cpu: 0.5, memory: 1Gi }
    secretEnv:
      CARACAL_AUTH_DATABASE_URL: authDatabaseUrl
      CARACAL_AUTH_SECRET: caracalAuthSecret
    env:
      NODE_ENV: production
      LOG_LEVEL: '{logLevel}'
      CARACAL_AUTH_DATABASE_SSL: '{database.sslMode}'

  - name: authMigrate
    image: web
    command: /app/auth/dist/migrate.js
    resources: { cpu: 0.5, memory: 1Gi }
    envSecrets:
      CARACAL_AUTH_DATABASE_URL: authDatabaseUrl
      CARACAL_AUTH_SECRET: caracalAuthSecret
    env:
      NODE_ENV: production
      LOG_LEVEL: '{logLevel}'
      CARACAL_AUTH_DATABASE_SSL: '{database.sslMode}'
