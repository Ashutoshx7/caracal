# Reference GKE overlay resolving the per-cloud values the cloud-managed example leaves open.

# Experimental. Renders and validates, not yet exercised against a live cluster.
#
# Layer this after values.cloud-managed.yaml:
#   helm upgrade --install caracal ../ -n caracal --create-namespace \
#     -f values.cloud-managed.yaml -f values.gke.yaml

serviceAccount:
  create: true
  annotations:
    # Workload Identity. The Google service account must also grant
    # roles/iam.workloadIdentityUser to this namespace and service account.
    iam.gke.io/gcp-service-account: caracal-runtime@caracal-prod.iam.gserviceaccount.com

secrets:
  create: false
  database:
    # Private IP of a Cloud SQL instance, or the Cloud SQL Auth Proxy sidecar address.
    host: 10.20.0.3
    port: 5432
    name: caracal
    sslMode: require
  redis:
    host: 10.20.0.4
    # Memorystore with in-transit encryption requires the rediss:// scheme in the
    # runtime Secret's redisUrl.
    port: 6379
    database: 0

replayPersistence:
  enabled: true
  # Persistent Disk. Zone-bound, so a StatefulSet replica is pinned to the zone
  # holding its volume.
  storageClassName: premium-rwo
  accessModes:
    - ReadWriteOnce
  size: 5Gi

networkPolicy:
  enabled: true
  allowOpenDns: false
  allowOpenHttps: false
  dnsEgress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  # The GCE ingress controller health-checks and forwards from Google's own
  # ranges rather than from a controller pod.
  extraIngress:
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  extraEgress:
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # Secret Manager, Cloud Storage, and the workload identity token endpoint.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

ingress:
  sts:
    enabled: true
    className: gce
    host: sts.caracal.example.com
    annotations:
      networking.gke.io/managed-certificates: caracal-sts
      kubernetes.io/ingress.allow-http: 'false'
  gateway:
    enabled: true
    className: gce
    host: gateway.caracal.example.com
    annotations:
      networking.gke.io/managed-certificates: caracal-gateway
      kubernetes.io/ingress.allow-http: 'false'
  api:
    enabled: true
    className: gce
    host: api.caracal.example.com
    annotations:
      networking.gke.io/managed-certificates: caracal-api
      kubernetes.io/ingress.allow-http: 'false'

services:
  sts:
    # External verifiers resolve the issuer, so it must be the public origin.
    issuerUrl: https://sts.caracal.example.com
  web:
    enabled: true
    publicUrl: https://console.caracal.example.com
