# Development Helm values for local and disposable Caracal clusters.

global:
  mode: dev
  evaluation: true
  imagePullPolicy: IfNotPresent

networkPolicy:
  allowOpenDns: true
  allowOpenHttps: true

secrets:
  # Disposable dev stores terminate plaintext; production profiles keep require.
  database:
    sslMode: disable

services:
  # An HPA owns the replica count once it exists, and its minReplicas of 2 would
  # override the single replica below. Disabling it keeps a dev cluster at one
  # replica per service, which also matches what a node without metrics-server
  # can actually schedule.
  sts:
    replicas: 1
    hpa:
      enabled: false
  gateway:
    replicas: 1
    hpa:
      enabled: false
  api:
    replicas: 1
    hpa:
      enabled: false
  coordinator:
    replicas: 1
    hpa:
      enabled: false
  audit:
    replicas: 1
    hpa:
      enabled: false
  web:
    replicas: 1
    hpa:
      enabled: false
    # The serving gate requires a sign-in method; this evaluation cluster is
    # disposable and unreachable from any OAuth provider, so placeholder GitHub
    # credentials satisfy presence without granting anything.
    extraEnv:
      - name: GITHUB_CLIENT_ID
        value: evaluation-placeholder
      - name: GITHUB_CLIENT_SECRET
        value: evaluation-placeholder
