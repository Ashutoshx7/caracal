# Reference AKS overlay resolving the per-cloud values the cloud-managed example leaves open.

# Layer this after values.cloud-managed.yaml:
#   helm upgrade --install caracal ../ -n caracal --create-namespace \
#     -f values.cloud-managed.yaml -f values.aks.yaml
#
# Only the values that are genuinely Azure-specific appear here: the storage
# class, the ingress class, the workload-identity binding, and the managed
# endpoints. Everything else stays in the cloud-agnostic overlay.

global:
  # Required by the azure-workload-identity webhook to project a federated
  # token into the pods. Without it the ServiceAccount annotation has no effect.
  podLabels:
    azure.workload.identity/use: 'true'

serviceAccount:
  create: true
  annotations:
    # Client ID of the user-assigned managed identity federated with this
    # cluster's OIDC issuer. Grants keyless access to Key Vault for the secret
    # backend and to Blob Storage for audit export.
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000

secrets:
  create: false
  database:
    host: caracal-prod.postgres.database.azure.com
    port: 5432
    name: caracal
    # Azure Database for PostgreSQL Flexible Server enforces TLS by default.
    sslMode: require
  redis:
    host: caracal-prod.redis.cache.windows.net
    # Azure Cache for Redis serves TLS on 6380 and disables the plaintext port.
    # The runtime Secret's redisUrl must therefore use the rediss:// scheme.
    port: 6380
    database: 0

replayPersistence:
  enabled: true
  # Azure Disk. Zone-bound, so a StatefulSet replica is pinned to the zone that
  # holds its volume; managed-csi-premium raises IOPS for busier deployments.
  storageClassName: managed-csi
  accessModes:
    - ReadWriteOnce
  size: 5Gi

networkPolicy:
  enabled: true
  allowOpenDns: false
  allowOpenHttps: false
  dnsEgress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  extraIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app-routing-system
      ports:
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  extraEgress:
    # Replace with the private-endpoint subnet holding Postgres and Redis.
    - to:
        - ipBlock:
            cidr: 10.20.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6380
    # Entra ID and Key Vault, required by workload identity and the secret backend.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

ingress:
  sts:
    enabled: true
    # Managed NGINX from the AKS app routing add-on. Use "nginx" instead when
    # you run your own ingress-nginx, or "azure-application-gateway" for AGIC.
    className: webapprouting.kubernetes.azure.com
    host: sts.caracal.example.com
    tlsSecretName: caracal-sts-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  gateway:
    enabled: true
    className: webapprouting.kubernetes.azure.com
    host: gateway.caracal.example.com
    tlsSecretName: caracal-gateway-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  api:
    enabled: true
    className: webapprouting.kubernetes.azure.com
    host: api.caracal.example.com
    tlsSecretName: caracal-api-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

services:
  sts:
    # External verifiers resolve the issuer, so it must be the public origin.
    issuerUrl: https://sts.caracal.example.com
  web:
    enabled: true
    publicUrl: https://console.caracal.example.com
