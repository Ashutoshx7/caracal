#
# Example deployment config for rendering Caracal onto Google Cloud Run.

# Experimental. This target renders and validates, but has not been exercised
# against a live Google Cloud project. Azure Container Apps is the tested
# reference.
#
#   node infra/containerPlatform/render.mjs --config gcp.yaml --out ./out
#
# Provider wiring only. Service topology lives in topology.yaml. No credential
# value belongs here: secrets are referenced by name in Secret Manager.

target: gcpCloudRun

release:
  # Import the published GHCR images into Artifact Registry rather than rebuilding.
  registry: asia-south1-docker.pkg.dev/caracal-prod/caracal
  version: 0.2.1

mode: stable
logLevel: info

database:
  host: 10.20.0.3
  port: 5432
  user: caracal
  name: caracal
  sslMode: require

# Redis is reached through the redisUrl secret. Memorystore with in-transit
# encryption requires the rediss:// scheme in that secret.

public:
  web: https://console.caracal.example.com
  api: https://api.caracal.example.com
  sts: https://sts.caracal.example.com
  gateway: https://gateway.caracal.example.com

# Operator sign-in. At least one method is required: without one the console
# deploys healthy but nobody can register, so rendering fails instead. Client
# ids are public identifiers; each secret is the NAME of a secret in the
# provider's secret manager, delivered like every other credential.
console:
  operatorEmails:
    - richard.hendricks@piedpiper.example
  auth:
    googleClientId: 000000000000-anton.apps.googleusercontent.com
    googleClientSecret: consoleGoogleClientSecret

observability:
  otlpEndpoint: ''

coordinator:
  idempotencyRetentionSeconds: 604800
  generatedIdempotencyRetentionSeconds: 86400
  maxReceiptsPerScope: 10000
  bodyLimitBytes: 262144
  sessionRetentionDays: 90

gcp:
  project: caracal-prod
  # Cloud Run service URLs embed the project number, not the project ID.
  projectNumber: '000000000000'
  region: asia-south1
  # Runtime identity. Needs roles/secretmanager.secretAccessor on the caracal-*
  # secrets and Artifact Registry reader on the repository.
  serviceAccount: caracal-runtime@caracal-prod.iam.gserviceaccount.com
  # Prefix for the Secret Manager entries listed in the rendered secrets.txt.
  secretPrefix: caracal
