{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "caracal.serviceAccountName" . }}
  labels:
    {{- include "caracal.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
---
{{- end }}
{{- if .Values.migrations.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "caracal.fullname" . }}-migrate
  labels:
    {{- include "caracal.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # The migration Jobs run as pre-install hooks, before the workload
    # ServiceAccount exists, so their identity is created in the hook phase.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
{{- end }}
