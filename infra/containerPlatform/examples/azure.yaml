#
# Example deployment config for rendering Caracal onto a managed container platform.

# Copy this file, fill in the values for your deployment, and render with:
#   node infra/containerPlatform/render.mjs --config deployment.yaml --out ./out
#
# This file holds only deployment identity and provider wiring. Service topology
# lives in topology.yaml and is not restated here. No credential value belongs in
# this file: secrets are referenced by name in the provider's secret manager.

target: azureContainerApps

release:
  # Registry the images were imported into. Import the published GHCR images
  # rather than rebuilding them; see the operations documentation.
  registry: caracalprod.azurecr.io
  version: 0.2.1

# Published-mode guardrails. Keep "stable" for production.
mode: stable
logLevel: info

database:
  host: caracal-prod.postgres.database.azure.com
  port: 5432
  user: caracal
  name: caracal
  sslMode: require

# Redis is reached through the redisUrl secret in the vault, not from this file.
# Azure Cache for Redis serves TLS on 6380 and disables the plaintext port, so
# that secret must use the rediss:// scheme.

# Externally reachable origins. Every listed service must resolve to the platform
# ingress for that service and terminate TLS.
public:
  web: https://console.example.com
  api: https://api.example.com
  sts: https://sts.example.com
  gateway: https://gateway.example.com

observability:
  otlpEndpoint: ''

coordinator:
  idempotencyRetentionSeconds: 604800
  generatedIdempotencyRetentionSeconds: 86400
  maxReceiptsPerScope: 10000
  bodyLimitBytes: 262144
  sessionRetentionDays: 90

azure:
  resourceGroup: caracal-prod
  location: centralindia
  environmentName: caracal-prod
  # Suffix from `az containerapp env show --query properties.defaultDomain`.
  # Internal service-to-service URLs are derived from it.
  environmentDomain: politeglacier-1a2b3c4d.centralindia.azurecontainerapps.io
  # User-assigned identity used to pull images and read Key Vault secrets. It
  # needs AcrPull on the registry and Key Vault Secrets User on the vault.
  identityId: /subscriptions/SUBSCRIPTION_ID/resourceGroups/caracal-prod/providers/Microsoft.ManagedIdentity/userAssignedIdentities/caracal-prod
  keyVaultUrl: https://caracal-prod.vault.azure.net
  # Durable storage for the audit evidence STS and Gateway spill to disk when
  # Redis is unreachable. Left unset, each replica uses local ephemeral storage
  # and a replaced replica loses evidence it had not yet drained.
  #
  # Only attach an NFS share here. The spill path fsyncs files and their parent
  # directory, which SMB shares do not reliably honor, and a failed fsync is
  # recorded as lost evidence and fails readiness.
  # stateStorageName: caracal-replay
