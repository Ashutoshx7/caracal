#
# Reference EKS overlay resolving the per-cloud values the cloud-managed example leaves open.

# Experimental. Renders and validates, not yet exercised against a live cluster.
#
# Layer this after values.cloud-managed.yaml:
#   helm upgrade --install caracal ../ -n caracal --create-namespace \
#     -f values.cloud-managed.yaml -f values.eks.yaml

serviceAccount:
  create: true
  annotations:
    # IRSA. The role's trust policy must name this cluster's OIDC provider and
    # this namespace and service account.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/caracal-runtime

secrets:
  create: false
  database:
    host: caracal-prod.cluster-abc123.ap-south-1.rds.amazonaws.com
    port: 5432
    name: caracal
    sslMode: require
  redis:
    host: caracal-prod.abc123.ng.0001.aps1.cache.amazonaws.com
    # ElastiCache with in-transit encryption serves TLS on 6379; the runtime
    # Secret's redisUrl must then use the rediss:// scheme.
    port: 6379
    database: 0

replayPersistence:
  enabled: true
  # EBS. Zone-bound, so a StatefulSet replica is pinned to the zone holding its volume.
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  size: 5Gi

networkPolicy:
  enabled: true
  allowOpenDns: false
  allowOpenHttps: false
  dnsEgress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  # The AWS Load Balancer Controller sends traffic from the node or pod directly
  # rather than from a controller pod, so admit the VPC range that carries it.
  extraIngress:
    - from:
        - ipBlock:
            cidr: 10.60.0.0/16
      ports:
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
  extraEgress:
    - to:
        - ipBlock:
            cidr: 10.60.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # STS, Secrets Manager, and S3 endpoints used by the secret backend and audit export.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

ingress:
  sts:
    enabled: true
    className: alb
    host: sts.caracal.example.com
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
  gateway:
    enabled: true
    className: alb
    host: gateway.caracal.example.com
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
  api:
    enabled: true
    className: alb
    host: api.caracal.example.com
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:000000000000:certificate/00000000-0000-0000-0000-000000000000

services:
  sts:
    # External verifiers resolve the issuer, so it must be the public origin.
    issuerUrl: https://sts.caracal.example.com
  web:
    enabled: true
    publicUrl: https://console.caracal.example.com
