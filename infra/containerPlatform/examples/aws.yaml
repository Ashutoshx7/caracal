#
# Example deployment config for rendering Caracal onto AWS ECS on Fargate.

# Experimental. This target renders and validates, but has not been exercised
# against a live AWS account. Azure Container Apps is the tested reference.
#
#   node infra/containerPlatform/render.mjs --config aws.yaml --out ./out
#
# Provider wiring only. Service topology lives in topology.yaml. No credential
# value belongs here: secrets are referenced by name in Secrets Manager.

target: awsEcs

release:
  # Import the published GHCR images into ECR rather than rebuilding them.
  registry: 000000000000.dkr.ecr.ap-south-1.amazonaws.com
  version: 0.2.1

mode: stable
logLevel: info

database:
  host: caracal-prod.cluster-abc123.ap-south-1.rds.amazonaws.com
  port: 5432
  user: caracal
  name: caracal
  sslMode: require

# Redis is reached through the redisUrl secret. ElastiCache with in-transit
# encryption requires the rediss:// scheme in that secret.

public:
  web: https://console.example.com
  api: https://api.example.com
  sts: https://sts.example.com
  gateway: https://gateway.example.com

observability:
  otlpEndpoint: ''

coordinator:
  idempotencyRetentionSeconds: 604800
  generatedIdempotencyRetentionSeconds: 86400
  maxReceiptsPerScope: 10000
  bodyLimitBytes: 262144
  sessionRetentionDays: 90

aws:
  region: ap-south-1
  accountId: '000000000000'
  cluster: caracal-prod
  # Pulls images and resolves Secrets Manager values before the container starts.
  executionRoleArn: arn:aws:iam::000000000000:role/caracal-execution
  # The identity the running services use for the secret backend and audit export.
  taskRoleArn: arn:aws:iam::000000000000:role/caracal-task
  subnetIds:
    - subnet-0aaaaaaaaaaaaaaaa
    - subnet-0bbbbbbbbbbbbbbbb
  securityGroupIds:
    - sg-0cccccccccccccccc
  # Cloud Map namespace backing Service Connect, which gives each service the
  # stable in-cluster name the internal URLs resolve to.
  namespaceArn: arn:aws:servicediscovery:ap-south-1:000000000000:namespace/ns-caracal
  # Prefix for the Secrets Manager entries listed in the rendered secrets.txt.
  secretPrefix: caracal
  # Public services attach to an existing Application Load Balancer target group.
  targetGroupArns:
    web: arn:aws:elasticloadbalancing:ap-south-1:000000000000:targetgroup/caracal-web/0000000000000000
    api: arn:aws:elasticloadbalancing:ap-south-1:000000000000:targetgroup/caracal-api/0000000000000000
    sts: arn:aws:elasticloadbalancing:ap-south-1:000000000000:targetgroup/caracal-sts/0000000000000000
    gateway: arn:aws:elasticloadbalancing:ap-south-1:000000000000:targetgroup/caracal-gateway/0000000000000000
