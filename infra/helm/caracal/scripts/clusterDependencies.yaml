#
# Postgres and Redis dependencies for validating a chart install in a disposable cluster.

# The chart expects operator-provided stores. These stand in for them so an
# install can be exercised end to end; CARACAL_IMAGE_TAG is substituted with the
# chart's appVersion so the stores always match the release under test.
# Credentials here are generated per run and passed in; nothing is committed.

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/garudex-labs/caracal-postgres:CARACAL_IMAGE_TAG
          env:
            - name: POSTGRES_USER
              value: caracal
            - name: POSTGRES_DB
              value: caracal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cluster-dependencies
                  key: postgresPassword
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'caracal', '-d', 'caracal', '-h', '127.0.0.1']
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      # The image runs as the redis user, which must own the mounted data path.
      securityContext:
        fsGroup: 999
      containers:
        - name: redis
          image: ghcr.io/garudex-labs/caracal-redis:CARACAL_IMAGE_TAG
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cluster-dependencies
                  key: redisPassword
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ['sh', '-c', 'test -f /run/caracal/provisioned']
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
